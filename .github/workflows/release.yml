name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# push novo cancela a release anterior ainda em andamento (a tag dela é apagada no passo "Remover tag")
concurrency:
  group: release
  cancel-in-progress: true

# actions fixadas por SHA (tag no comentário); o Dependabot mantém atualizadas.
# Permissão de escrita só nos jobs que precisam (tag e release).
permissions: {}

jobs:
  version:
    name: Calcular versão
    runs-on: ubuntu-latest
    permissions:
      contents: write # push da tag
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # precisa do histórico e das tags

      - id: next
        run: .github/scripts/next-version.sh >> "$GITHUB_OUTPUT"

      # a tag sai já no começo, apontando pro commit deste push: se a main andar durante o build,
      # o GitHub não deixa o GITHUB_TOKEN criar a tag lá no fim (Resource not accessible by integration)
      - name: Criar tag
        if: steps.next.outputs.release == 'true'
        run: |
          git tag "v${{ steps.next.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.next.outputs.version }}"

      - name: Resumo
        run: |
          if [[ "${{ steps.next.outputs.release }}" == "true" ]]; then
            echo "Release v${{ steps.next.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sem feat/fix/perf/refactor/ui desde a última tag: nada a lançar." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build e release (Apple Silicon)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    # secrets de assinatura ficam no environment "release", liberado só pra main
    environment: release
    permissions:
      contents: write # criar a release e subir os artefatos
    env:
      # LTO "thin" só no CI: build bem mais rápido, app um pouco maior que o "fat" do Cargo.toml
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # o tauri-action procura os artefatos (ex.: Dynamic Lite_X.Y.Z_aarch64.dmg) pela versão escrita no
      # tauri.conf.json, não pela do --config do scripts/tauri.sh; sem isso o .dmg não sobe pra Release
      - name: Aplicar versão no tauri.conf.json
        run: |
          jq --arg v "${{ needs.version.outputs.version }}" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      # O macOS amarra cada permissão (Automação, áudio, Calendários, Acessibilidade, Keychain) à identidade de assinatura
      # do app. Ad-hoc ("-") tem identidade = hash do binário, que muda a cada build: toda atualização pede tudo de novo.
      # Um certificado autoassinado fixo dá identidade estável (bundle id + certificado), e as permissões sobrevivem.
      # Não é Developer ID: o Gatekeeper continua barrando (o `xattr -cr` da instalação segue valendo).
      # Gerar o .p12 e cadastrar os secrets: ver "Assinatura" no README.
      - name: Importar certificado de assinatura
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # o codesign procura no keychain padrão e nos da lista: o novo entra na frente
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          # certificado autoassinado aparece como não confiável (CSSMERR_TP_NOT_TRUSTED), mas o codesign assina por nome
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Usar o certificado no tauri.conf.json
        run: |
          jq '.bundle.macOS.signingIdentity = "Dynamic Lite Signing"' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      # a tag ainda não existe aqui: scripts/tauri.sh usa APP_VERSION no lugar dela
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          # assina o .app.tar.gz e gera o latest.json que o app consulta pra se atualizar
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --target aarch64-apple-darwin
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Dynamic Lite v${{ needs.version.outputs.version }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: false
          prerelease: false

      - name: Remover keychain de assinatura
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # build falhou ou foi cancelado: apaga a tag pra próxima versão não pular esta
      - name: Remover tag
        if: failure() || cancelled()
        run: git push origin --delete "v${{ needs.version.outputs.version }}" || true
