name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# push novo cancela a release anterior ainda em andamento (a tag dela é apagada no passo "Remover tag")
concurrency:
  group: release
  cancel-in-progress: true

# actions fixadas por SHA (tag no comentário); o Dependabot mantém atualizadas.
# Permissão de escrita só nos jobs que precisam (tag e release).
permissions: {}

jobs:
  version:
    name: Calcular versão
    runs-on: ubuntu-latest
    permissions:
      contents: write # push da tag
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # precisa do histórico e das tags

      - id: next
        run: .github/scripts/next-version.sh >> "$GITHUB_OUTPUT"

      # a tag sai já no começo, apontando pro commit deste push: se a main andar durante o build,
      # o GitHub não deixa o GITHUB_TOKEN criar a tag lá no fim (Resource not accessible by integration)
      - name: Criar tag
        if: steps.next.outputs.release == 'true'
        run: |
          git tag "v${{ steps.next.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.next.outputs.version }}"

      - name: Resumo
        run: |
          if [[ "${{ steps.next.outputs.release }}" == "true" ]]; then
            echo "Release v${{ steps.next.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sem feat/fix/perf/refactor/ui desde a última tag: nada a lançar." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build e release (universal)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    # secrets de assinatura ficam no environment "release", liberado só pra main
    environment: release
    permissions:
      contents: write # criar a release e subir os artefatos
    env:
      # LTO "thin" só no CI: build bem mais rápido, app um pouco maior que o "fat" do Cargo.toml
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # o tauri-action procura os artefatos (ex.: Dynamic Lite_X.Y.Z_universal.dmg) pela versão escrita no
      # tauri.conf.json, não pela do --config do scripts/tauri.sh; sem isso o .dmg não sobe pra Release
      - name: Aplicar versão no tauri.conf.json
        run: |
          jq --arg v "${{ needs.version.outputs.version }}" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      # a tag ainda não existe aqui: scripts/tauri.sh usa APP_VERSION no lugar dela
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          # assina o .app.tar.gz e gera o latest.json que o app consulta pra se atualizar
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: --target universal-apple-darwin
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Dynamic Lite v${{ needs.version.outputs.version }}
          releaseBody: ${{ needs.version.outputs.notes }}
          releaseDraft: false
          prerelease: false

      # build falhou ou foi cancelado: apaga a tag pra próxima versão não pular esta
      - name: Remover tag
        if: failure() || cancelled()
        run: git push origin --delete "v${{ needs.version.outputs.version }}" || true
