name: CI

on:
  pull_request:
    branches: [main]

# actions fixadas por SHA (tag no comentário); o Dependabot mantém atualizadas
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck e build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck e build do frontend
        run: bun run build

      - name: Checar o Rust
        working-directory: src-tauri
        run: cargo check --locked

      - name: Prévia da versão
        run: .github/scripts/next-version.sh | tee -a "$GITHUB_STEP_SUMMARY"
