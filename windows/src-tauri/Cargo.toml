[package]
name = "dynamic-lite"
version = "0.1.0"
description = "Dynamic Island para Windows"
authors = ["rzz"]
license = "MIT"
edition = "2021"

[lib]
# sufixo _lib evita conflito de nome com o binário
name = "dynamic_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows-collections = "0.3"
windows = { version = "0.62", features = [
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
